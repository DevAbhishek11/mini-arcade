<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060c" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini Arcade" />
    <meta
      name="description"
      content="Mini Arcade — realtime multiplayer arcade with server authoritative games, Elo ladders and live leaderboards."
    />
    <title>Mini Arcade — play 7 classic games online, free</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mini Arcade" />
    <meta property="og:title" content="Mini Arcade — real opponents, real stakes" />
    <meta
      property="og:description"
      content="Seven classic games with realtime multiplayer, private rooms, smart bots and a full offline mode. No signup."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mini Arcade — real opponents, real stakes" />
    <meta
      name="twitter:description"
      content="Seven classic games with realtime multiplayer, private rooms, smart bots and a full offline mode."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link rel="preload" as="image" href="/art/hero.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; visible only while the bundle loads. -->
      <div class="boot-splash" style="display: grid; min-height: 100dvh; place-items: center">
        <div style="text-align: center; font-family: system-ui, sans-serif">
          <div
            style="
              margin: 0 auto;
              display: grid;
              width: 3.5rem;
              height: 3.5rem;
              place-items: center;
              border-radius: 1rem;
              background: linear-gradient(135deg, #22d3ee, #a78bfa);
              font-size: 1.5rem;
              font-weight: 700;
              color: #05060c;
            "
          >
            A
          </div>
          <p style="margin-top: 1.25rem; font-size: 0.875rem; color: #64748b">Inserting coin…</p>
        </div>
      </div>
    </div>

    <script>
      /**
       * Last-resort visibility. If the bundle fails to parse or throws before
       * React mounts, the page would otherwise stay blank forever with the
       * reason buried in the console — so surface it on the page instead.
       */
      (function () {
        var reported = false;
        function fail(detail) {
          if (reported) return;
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.boot-splash')) return;
          reported = true;
          root.innerHTML =
            '<div style="display:grid;min-height:100dvh;place-items:center;padding:2rem;font-family:system-ui,sans-serif;text-align:center;color:#cbd5e1">' +
            '<div><h1 style="font-size:1.25rem;font-weight:700;color:#fff">Mini Arcade could not start</h1>' +
            '<p style="margin-top:.5rem;max-width:32rem;font-size:.875rem;color:#94a3b8">' +
            (detail || 'The app scripts did not load. Check your connection and try again.') +
            '</p><div style="margin-top:1.5rem;display:flex;gap:.75rem;justify-content:center">' +
            '<button onclick="location.reload()" style="border-radius:.75rem;background:#22d3ee;padding:.6rem 1.1rem;font-weight:600;color:#05060c;border:0;cursor:pointer">Reload</button>' +
            '<a href="/solo/tic-tac-toe" style="border-radius:.75rem;border:1px solid #334155;padding:.6rem 1.1rem;font-weight:600;color:#e2e8f0;text-decoration:none">Play offline</a>' +
            '</div></div></div>';
        }

        window.addEventListener('error', function (event) {
          fail(event.message ? String(event.message) : null);
        });
        window.addEventListener('unhandledrejection', function (event) {
          fail(event.reason && event.reason.message ? String(event.reason.message) : null);
        });
        // Nothing rendered after 12 seconds means something is badly wrong.
        window.setTimeout(function () {
          fail(null);
        }, 12000);
      })();
    </script>
    <noscript>
      <div style="padding: 3rem; text-align: center; font-family: system-ui; color: #cbd5e1">
        Mini Arcade needs JavaScript to run its game engines. Please enable it and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
